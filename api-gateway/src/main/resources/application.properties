server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=video-catalogue
spring.cloud.gateway.routes[0].uri=lb://VIDEO-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/videos/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=video-streaming
spring.cloud.gateway.routes[1].uri=lb://STREAMING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/stream/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=video-ui
spring.cloud.gateway.routes[2].uri=lb://VIDEO-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/,/index.html
